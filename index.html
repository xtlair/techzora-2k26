          return `<tr>
          <td class="mono small">${r.id}</td>
          <td><b>${escapeHtml(r.teamName)}</b></td>
          <td class="small">${r.selectedEvents.map(se=>`${se.eventName} ${sessionPill(se.session)}`).join('<br>')}</td>
          <td class="small">${r.college}</td>
          <td class="small">${memberCount}</td>
          <td>${badgeHTML(r.status)}</td>
          <td>${paymentBadgeHTML(r)}</td>
          <td class="small">${authorized ? '✓ Authorized' : '— Pending'}</td>
          <td class="small">${r.refreshmentStatus==='COLLECTED' ? '🥤 Collected' : '— Not yet'}</td>
          <td class="small">₹${r.amount}</td>
          <td class="small">${fmtDateTime(r.createdAt)}</td>
          <td class="small">${r.paymentAuthorizedBy ? userName(r.paymentAuthorizedBy) : '—'}</td>
          <td class="small">${r.paymentAuthorizedAt ? fmtDateTime(r.paymentAuthorizedAt) : '—'}</td>
          <td style="white-space:nowrap;">
            <button class="icon-btn" onclick="App.nav('ticket',{regId:'${r.id}'})">View</button>
            ${App.requireRole(['ADMIN','SUPER_ADMIN']) ? `<button class="icon-btn" onclick="openEditRegModal('${r.id}')">Edit</button>` : ''}
            ${App.requireRole(['ADMIN','SUPER_ADMIN']) && r.status==='REGISTERED' ? (
              authorized
                ? `<span class="badge paid" style="white-space:nowrap;">✓ PAYMENT ALREADY AUTHORIZED</span>`
                : `<button class="btn btn-primary btn-sm" onclick="openAuthorizePaymentModal('${r.id}')">AUTHORIZE PAYMENT</button>`
            ) : ''}
            ${App.requireRole(['SUPER_ADMIN']) && r.status==='REGISTERED' ? `<button class="icon-btn" style="color:var(--coral)" onclick="App.cancelRegistration('${r.id}')">Cancel</button>` : ''}

/* Draws the ticket QR once the generator library is ready. Split out from
   attachPostRenderHooks (which must stay synchronous) so the same CDN-outage
   protection used by the scanner also covers ticket generation — previously
   this used `new QRCode(...)` directly and would throw a silent
   ReferenceError on any device where the single cdnjs <script> tag failed. */
async function renderTicketQR(qrBox, regId){
  if(typeof QRCode === 'undefined'){
    qrBox.textContent = 'Loading QR…';
    await QRCodeReady;
  }
  if(typeof QRCode === 'undefined'){
    qrBox.textContent = '';
    qrBox.innerHTML = `<div style="font-size:12px;color:#c2495a;padding:8px;text-align:center;">QR code library failed to load.<br>Registration ID: <b>${escapeHtml(regId)}</b></div>`;
    return;
  }
  // Only render if this box is still the one on screen for this reg (guards
  // against a slow load finishing after the user has navigated away).
  if(!document.body.contains(qrBox)) return;
  qrBox.innerHTML = '';
  new QRCode(qrBox, {text: regId, width:150, height:150, colorDark:'#150f2e', colorLight:'#ffffff'});
  qrBox.setAttribute('role','img');
  qrBox.setAttribute('aria-label', `QR code for registration ${regId}`);
}

function attachPostRenderHooks(){
  const qrBox = document.getElementById('qr-render');
  if(qrBox && App.view==='ticket'){
    const reg = App.findReg(App.params.regId || '');
    if(reg && reg.paymentStatus==='PAID' && reg.paymentAuthorized===true){
      renderTicketQR(qrBox, reg.id);
    }
  }

  linkFieldLabels();

  const heroSection = document.getElementById('hero-section');
  const scene = document.getElementById('orbit-scene');
  if(heroSection && scene){
    heroSection.onmousemove = (e)=>{
      const r = heroSection.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width - 0.5;
      const py = (e.clientY - r.top) / r.height - 0.5;
      scene.style.transform = `rotateY(${px*14}deg) rotateX(${-py*10}deg)`;
    };
    heroSection.onmouseleave = ()=>{ scene.style.transform = 'rotateY(0deg) rotateX(0deg)'; };
  }

  if(App.modal){
    const dialog = document.querySelector('.modal-focus-wrap');
    if(dialog){
      const heading = dialog.querySelector('h2, h3');
      if(heading){ heading.setAttribute('tabindex','-1'); heading.focus(); }
      const focusables = dialog.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
      if(focusables.length){
        dialog.addEventListener('keydown', function trapKey(e){
          if(e.key === 'Tab'){
            const first = focusables[0], last = focusables[focusables.length-1];
            if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
            else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
          }
        });
      }
    }
  }
}

/* Links every .field's <label> to its input/select/textarea by id, so screen
   readers announce the correct field name. Runs after every render since the
   whole app is re-templated as an HTML string each time. */
function linkFieldLabels(){
  let counter = 0;
  document.querySelectorAll('.field').forEach(field=>{
    const label = field.querySelector('label');
    const control = field.querySelector('input, select, textarea');
    if(!label || !control) return;
    if(!control.id){ control.id = `f-${control.name || 'field'}-${counter++}`; }
    label.setAttribute('for', control.id);
  });
}

/* Escape closes any open modal */
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape' && App.modal){ App.closeModal(); }
});

/* ============================= EVENT HANDLERS ============================= */
function formToObj(form){
  const data = {};
  new FormData(form).forEach((v,k)=>{ data[k]=v; });
  return data;
}
function handleRegisterSubmit(e){
  e.preventDefault();
  const f = formToObj(e.target);
  f.primaryEventId = App.regWizard.primaryEventId;
  if(App.regWizard.wantsSecond === true && !App.regWizard.secondaryEventId){
    App.toast('Please select your additional event.');
    return false;
  }
  f.secondaryEventId = App.regWizard.wantsSecond ? App.regWizard.secondaryEventId : null;
  App.submitRegistration(f);
  return false;
}
function handleCheckReg(e){
  e.preventDefault();
  const q = formToObj(e.target).q.trim();
  const found = App.findReg(q);
  App.nav('checkreg', {found, searched:true});
  return false;
}
function handleLogin(e){
  e.preventDefault();
  const f = formToObj(e.target);
  App.login(f.username, f.password);
  return false;
}
function handleRegSearch(e){
  e.preventDefault();
  const q = formToObj(e.target).q;
  App.nav('registrations', {q});
  return false;
}
function openEventModal(id){ App.openModal(eventModalHTML(id)); }
function handleEventSubmit(e, id){
  e.preventDefault();
  const f = formToObj(e.target);
  App.updateEvent(id, f);
  return false;
}
function handleManualScan(e){
  e.preventDefault();
  const token = formToObj(e.target).token;
  App.processScan(token);
  return false;
}
function downloadQR(regId){
  const canvas = document.querySelector('#qr-render canvas');
  if(!canvas){ App.toast('QR not ready yet'); return; }
  const link = document.createElement('a');
  link.download = `${regId}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

/* ============================= BOOT ============================= */
App.init();
</script>
