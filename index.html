<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TECHZORA 2K26 — Registration &amp; Hall Entry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<!-- QR libraries are loaded via loadScriptWithFallback() near the top of the
     main script below, trying multiple CDNs in sequence. A single-CDN <script>
     tag here was the original point of failure: if that one host was blocked
     or slow on venue WiFi, the whole scanner silently broke with no recovery. -->
<style>
:root{
  --bg-deep:#080a14; --bg-deep2:#0e1120; --bg-deep3:#161a30;
  --surface:#faf8f3; --card:#ffffff;
  --violet:#5b5a9e; --violet-dim:#454487; --violet-soft:#eeedf7;
  --amber:#c9a769; --mint:#3a9c82; --coral:#c2495a;
  --ink:#14141c; --cream:#f3f0e6; --muted:#6f6e7c; --muted-dark:#5a596b; --muted-on-dark:#a6a4b3;
  --line:#e8e4d8; --gold:#c9a769; --gold-dim:#a98a4c;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{overflow-x:hidden; max-width:100%;}
body{font-family:'Inter',sans-serif; background:var(--surface); color:var(--ink); -webkit-font-smoothing:antialiased;}
::selection{background:var(--gold); color:#14141c;}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif; letter-spacing:-.01em;}
.serif{font-family:'Playfair Display',serif;}
.mono{font-family:'JetBrains Mono',monospace;}

/* ---------- accessibility ---------- */
.skip-link{position:absolute; left:-9999px; top:0; z-index:999; background:var(--ink); color:#fff; padding:12px 18px; border-radius:0 0 10px 0; font-weight:700; font-size:14px;}
.skip-link:focus{left:0;}
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
  outline:3px solid var(--gold); outline-offset:2px; border-radius:6px;
}
.nav-links button:focus-visible{outline-color:#fff;}
@media(prefers-reduced-motion:reduce){
  *, *::before, *::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important;}
}
.visually-hidden{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; border:none;}
input,select,textarea{font-family:inherit; font-size:14px;}
#root{min-height:100vh;}

/* ---------- top nav ---------- */
.nav{position:sticky; top:0; z-index:50; background:rgba(16,14,28,0.92); backdrop-filter:blur(10px); border-bottom:1px solid rgba(255,255,255,0.08);}
.nav-inner{max-width:1180px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:14px 20px; gap:12px; flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:10px; color:#fff; font-weight:700; font-size:18px;}
.brand .dot{width:10px; height:10px; border-radius:3px; background:linear-gradient(135deg,var(--violet),var(--amber)); transform:rotate(45deg);}
.nav-links{display:flex; align-items:center; gap:4px; flex-wrap:wrap; min-width:0;}
.nav-links button{background:transparent; color:var(--cream); opacity:0.75; padding:8px 12px; border-radius:8px; font-size:13.5px; font-weight:600; transition:.15s; white-space:nowrap;}
.nav-links button:hover{opacity:1; background:rgba(255,255,255,0.08);}
.nav-links button.active{opacity:1; background:var(--violet); color:#fff;}
.pill-role{font-size:11px; font-weight:700; color:var(--ink); background:var(--amber); padding:4px 10px; border-radius:999px; text-transform:uppercase; letter-spacing:.04em;}
@media(max-width:640px){
  .nav-inner{padding:12px 14px; gap:8px;}
  .brand{font-size:15px; gap:7px;}
  .nav-links{gap:2px;}
  .nav-links button{padding:7px 9px; font-size:12.5px;}
}

/* ---------- generic layout ---------- */
.wrap{max-width:1180px; margin:0 auto; padding:32px 20px 80px;}
.wrap.narrow{max-width:720px;}
.section-head{margin-bottom:22px;}
.eyebrow{font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--violet-dim);}
.section-head h2{font-size:26px; margin-top:6px;}
.muted{color:var(--muted);}

/* ---------- hero ---------- */
.hero{background:radial-gradient(circle at 15% 0%, #1c1f3a 0%, var(--bg-deep) 55%), var(--bg-deep); color:#fff; position:relative; overflow:hidden;}
.hero::after{content:''; position:absolute; inset:0; background:
  radial-gradient(circle at 85% 10%, rgba(91,90,158,0.30), transparent 40%),
  radial-gradient(circle at 60% 90%, rgba(201,167,105,0.14), transparent 45%);
  pointer-events:none; z-index:0;}
.hero-inner{max-width:1180px; margin:0 auto; padding:64px 20px 56px; position:relative; z-index:3;}

/* ---------- cosmic hero decoration (3D) ---------- */
.cosmos{position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:1; perspective:1400px;}
.stars, .stars2{position:absolute; inset:-10%; background-repeat:repeat;}
.stars{background-image:radial-gradient(1.4px 1.4px at 20px 30px, rgba(255,255,255,.9), transparent),
  radial-gradient(1px 1px at 90px 120px, rgba(255,255,255,.7), transparent),
  radial-gradient(1.6px 1.6px at 160px 60px, rgba(255,255,255,.8), transparent),
  radial-gradient(1px 1px at 220px 180px, rgba(255,255,255,.6), transparent),
  radial-gradient(1.2px 1.2px at 300px 40px, rgba(255,255,255,.85), transparent),
  radial-gradient(1px 1px at 40px 200px, rgba(255,255,255,.5), transparent),
  radial-gradient(1.3px 1.3px at 250px 260px, rgba(255,255,255,.75), transparent),
  radial-gradient(1px 1px at 130px 220px, rgba(255,255,255,.55), transparent);
  background-size:340px 300px; animation:twinkle 6s ease-in-out infinite;}
.stars2{background-image:radial-gradient(1px 1px at 60px 90px, rgba(255,255,255,.55), transparent),
  radial-gradient(1.3px 1.3px at 180px 20px, rgba(255,255,255,.65), transparent),
  radial-gradient(1px 1px at 260px 140px, rgba(255,255,255,.5), transparent),
  radial-gradient(1.5px 1.5px at 320px 200px, rgba(255,255,255,.7), transparent),
  radial-gradient(1px 1px at 40px 260px, rgba(255,255,255,.5), transparent);
  background-size:380px 340px; animation:twinkle 8s ease-in-out infinite 2s;}
@keyframes twinkle{0%,100%{opacity:.5;}50%{opacity:1;}}

/* the whole 3D rig — tilts gently with mouse via inline transform set by JS */
.orbit-scene{position:absolute; right:2%; top:0; width:56%; height:100%; max-width:560px;
  z-index:2; transform-style:preserve-3d; transition:transform .6s ease-out;}
@media(max-width:900px){.orbit-scene{width:78%; right:0; opacity:.85;}}
@media(max-width:640px){.orbit-scene{width:100%; opacity:.6;}}

/* planet: real sphere with a texture that slowly rotates + a ring tilted in true 3D */
.planet-rig{position:absolute; left:52%; top:38%; width:180px; height:180px; transform-style:preserve-3d;
  animation:planet-bob 8s ease-in-out infinite;}
@keyframes planet-bob{0%,100%{transform:translateY(0) translateZ(0);}50%{transform:translateY(-16px) translateZ(20px);}}

.planet{position:absolute; inset:0; border-radius:50%; overflow:hidden;
  background:radial-gradient(circle at 30% 26%, #f5ecd2 0%, #ddbc7f 20%, #ad8a4b 48%, #4c3c1c 90%);
  box-shadow:inset -22px -18px 44px rgba(0,0,0,.6), inset 10px 8px 22px rgba(255,246,220,.3), 0 0 70px rgba(201,167,105,.4);}
.planet::before{content:''; position:absolute; inset:0; border-radius:50%; opacity:.5; mix-blend-mode:overlay;
  background:repeating-linear-gradient(96deg, rgba(255,255,255,.12) 0 6px, transparent 6px 18px, rgba(0,0,0,.10) 18px 24px);
  animation:planet-spin 14s linear infinite;}
.planet::after{content:''; position:absolute; inset:0; border-radius:50%;
  background:radial-gradient(circle at 70% 74%, rgba(0,0,0,.32), transparent 46%);}
@keyframes planet-spin{from{transform:translateX(-30%);}to{transform:translateX(0%);}}

.planet-ring-3d{position:absolute; left:50%; top:50%; width:340px; height:340px; margin:-170px 0 0 -170px;
  border-radius:50%; border:14px solid transparent;
  background:
    linear-gradient(#0000,#0000) padding-box,
    conic-gradient(from 0deg, rgba(233,213,168,.05), rgba(233,213,168,.75) 15%, rgba(201,167,105,.2) 30%, rgba(233,213,168,.6) 45%, rgba(201,167,105,.15) 60%, rgba(233,213,168,.7) 78%, rgba(201,167,105,.1) 92%, rgba(233,213,168,.05)) border-box;
  -webkit-mask:linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  transform:rotateX(78deg) rotateZ(-6deg); animation:ring-spin 22s linear infinite;}
@keyframes ring-spin{from{transform:rotateX(78deg) rotateZ(-6deg);}to{transform:rotateX(78deg) rotateZ(354deg);}}

/* small moon orbiting the planet on a tilted plane */
.moon-orbit{position:absolute; left:50%; top:50%; width:280px; height:280px; margin:-140px 0 0 -140px;
  transform:rotateX(70deg); animation:moon-orbit-spin 11s linear infinite;}
@keyframes moon-orbit-spin{from{transform:rotateX(70deg) rotateZ(0deg);}to{transform:rotateX(70deg) rotateZ(360deg);}}
.moon{position:absolute; left:50%; top:-9px; width:18px; height:18px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #efe6cf, #9a814f 65%, #4a3b1e); box-shadow:0 0 12px rgba(201,167,105,.5);}

/* hanging spaceship, tethered from the top of the scene, swaying like it's suspended */
.ship-rig{position:absolute; left:14%; top:0; width:70px; height:210px; transform-style:preserve-3d;
  animation:ship-sway 5s ease-in-out infinite; transform-origin:top center;}
@keyframes ship-sway{0%,100%{transform:rotate(-5deg) rotateY(-8deg) translateY(0);}50%{transform:rotate(5deg) rotateY(8deg) translateY(10px);}}
.ship-tether{position:absolute; left:35px; top:0; width:1px; height:130px;
  background:linear-gradient(rgba(255,255,255,0) 0%, rgba(255,255,255,.4) 60%, rgba(255,255,255,.5) 100%);}
.spaceship{position:absolute; left:0; top:120px; width:70px; height:70px;}
.spaceship svg{width:100%; height:100%; filter:drop-shadow(0 14px 18px rgba(0,0,0,.5));}
.thruster{position:absolute; left:30px; top:184px; width:10px; height:16px; border-radius:0 0 6px 6px;
  background:linear-gradient(rgba(233,213,168,.9), rgba(233,213,168,0)); filter:blur(1.5px);
  animation:thruster-pulse 1.1s ease-in-out infinite;}
@keyframes thruster-pulse{0%,100%{opacity:.5; height:12px;}50%{opacity:1; height:20px;}}

/* drifting asteroids for depth */
.asteroid{position:absolute; border-radius:50%; background:radial-gradient(circle at 35% 30%, #8a8577, #3c392f); opacity:.7;}
.a1{width:10px; height:10px; left:8%; top:20%; animation:drift1 9s ease-in-out infinite;}
.a2{width:6px; height:6px; left:30%; top:75%; animation:drift2 12s ease-in-out infinite;}
.a3{width:14px; height:14px; left:70%; top:82%; animation:drift1 10s ease-in-out infinite 1s;}
.a4{width:5px; height:5px; left:18%; top:55%; animation:drift2 7s ease-in-out infinite .5s;}
@keyframes drift1{0%,100%{transform:translate(0,0);}50%{transform:translate(14px,-18px);}}
@keyframes drift2{0%,100%{transform:translate(0,0);}50%{transform:translate(-12px,16px);}}
@media(max-width:640px){.ship-rig{opacity:.7;}}
.hero-tag{display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); padding:6px 14px; border-radius:999px; font-size:12.5px; font-weight:600; color:var(--cream); margin-bottom:22px;}
.hero-tag .live-dot{width:7px; height:7px; border-radius:50%; background:var(--mint); box-shadow:0 0 0 3px rgba(58,156,130,0.25); animation:pulse 1.8s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.hero h1{font-family:'Playfair Display',serif; font-size:clamp(40px,6.4vw,68px); line-height:1.05; font-weight:600; max-width:780px; position:relative; z-index:2;}
.hero h1 span{background:linear-gradient(90deg,var(--gold) 10%, #e8cd94 90%); -webkit-background-clip:text; background-clip:text; color:transparent; font-style:italic;}
.hero p.lead{margin-top:18px; font-size:17px; color:var(--muted-on-dark); max-width:560px; line-height:1.6;}
.hero-meta{display:flex; gap:28px; margin-top:30px; flex-wrap:wrap;}
.hero-meta div{font-size:13px; color:var(--muted-on-dark);}
.hero-meta div b{display:block; font-size:16px; color:#fff; font-family:'Space Grotesk',sans-serif; margin-top:2px;}
.hero-cta{display:flex; gap:12px; margin-top:34px; flex-wrap:wrap;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:13px 24px; border-radius:12px; font-weight:700; font-size:14.5px; transition:.15s; white-space:nowrap;}
.btn-primary{background:var(--violet); color:#fff; box-shadow:0 8px 24px -8px rgba(124,92,252,0.6);}
.btn-primary:hover{background:var(--violet-dim); transform:translateY(-1px);}
.btn-ghost{background:rgba(255,255,255,0.06); color:#fff; border:1px solid rgba(255,255,255,0.18);}
.btn-ghost:hover{background:rgba(255,255,255,0.13);}
.btn-light{background:#fff; color:var(--ink); border:1px solid var(--line);}
.btn-light:hover{background:var(--violet-soft); border-color:var(--violet);}
.btn-amber{background:var(--amber); color:var(--ink);}
.btn-block{width:100%;}
.btn-sm{padding:8px 14px; font-size:13px; border-radius:9px;}
.btn-danger{background:#fff0f0; color:var(--coral); border:1px solid #ffd7db;}
.btn:disabled{opacity:.5; cursor:not-allowed;}

/* ---------- cards ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px;}
.card.glass{background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.14); backdrop-filter:blur(8px); color:#fff;}
.grid{display:grid; gap:18px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:960px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

/* feature cards */
.feature-card{text-align:center;}
.feature-icon{width:44px; height:44px; margin:0 auto 12px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:var(--violet-soft); color:var(--gold-dim);}
.feature-icon svg{width:22px; height:22px;}
.feature-card b{display:block; font-family:'Space Grotesk',sans-serif; font-size:15px;}
.feature-card p{margin-top:4px;}

/* event cards */
.event-card{position:relative; border-radius:18px; padding:22px; color:#fff; overflow:hidden; min-height:170px; display:flex; flex-direction:column; justify-content:flex-end;}
.event-card::before{content:''; position:absolute; inset:0; opacity:.92;}
.event-card .cat{position:relative; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; opacity:.85;}
.event-card h3{position:relative; font-size:21px; margin-top:6px;}
.event-card .meta{position:relative; font-size:12.5px; margin-top:10px; opacity:.9; display:flex; gap:14px; flex-wrap:wrap;}
.event-card .fee{position:relative; margin-top:14px; display:flex; justify-content:space-between; align-items:center;}
.event-card .fee b{font-family:'Space Grotesk',sans-serif; font-size:18px;}

/* stat cards */
.stat{border-radius:16px; padding:18px 20px; background:var(--card); border:1px solid var(--line);}
.stat .label{font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
.stat .value{font-family:'Space Grotesk',sans-serif; font-size:30px; font-weight:700; margin-top:6px;}
.stat .sub{font-size:12px; color:var(--muted); margin-top:4px;}
.stat.accent{background:linear-gradient(135deg,var(--violet),#5b3fe0); color:#fff; border:none;}
.stat.accent .label{color:rgba(255,255,255,0.75);}
.stat.accent .sub{color:rgba(255,255,255,0.75);}

/* forms */
.field{margin-bottom:16px;}
.field label{display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--ink);}
.field .hint{font-size:11.5px; color:var(--muted); margin-top:4px;}
.field input, .field select, .field textarea{width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:10px; background:#fff; outline:none; transition:.15s;}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--violet); box-shadow:0 0 0 3px var(--violet-soft);}
.field textarea{min-height:80px; resize:vertical;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media(max-width:640px){.row2{grid-template-columns:1fr;}}

/* badges */
.badge{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:999px;}
.badge.paid{background:#e3faf3; color:#08704f;}
.badge.pending{background:#fff4e0; color:#7d5106;}
.badge.entered{background:#e7e2ff; color:var(--violet-dim);}
.badge.registered{background:#eef1fb; color:#586;}
.badge.registered{color:#4650a8;}

/* ticket */
.ticket-wrap{display:flex; justify-content:center;}
.ticket{width:100%; max-width:420px; background:linear-gradient(160deg,#1c1836,#100e1c); color:#fff; border-radius:22px; position:relative; box-shadow:0 30px 60px -20px rgba(20,10,50,0.5); overflow:hidden;}
.ticket-top{padding:26px 26px 20px;}
.ticket-top .evname{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--amber); font-weight:700;}
.ticket-top .team{font-family:'Space Grotesk',sans-serif; font-size:26px; margin-top:8px;}
.ticket-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:20px;}
.ticket-grid .k{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted-on-dark);}
.ticket-grid .v{font-size:14.5px; font-weight:600; margin-top:3px;}
.perf{position:relative; height:0; border-top:2px dashed rgba(255,255,255,0.22); margin:4px 0;}
.perf::before,.perf::after{content:''; position:absolute; top:-11px; width:22px; height:22px; border-radius:50%; background:var(--surface);}
.perf::before{left:-33px;} .perf::after{right:-33px;}
.ticket-bottom{padding:22px 26px 28px; display:flex; flex-direction:column; align-items:center; gap:14px;}
.qr-box{background:#fff; padding:14px; border-radius:14px;}
.qr-box.qr-locked{width:150px; height:150px; display:flex; align-items:center; justify-content:center; margin:0 auto; font-size:40px; background:#f4f2ea; border:2px dashed var(--line);}
.regid{font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:700; letter-spacing:.03em;}
.status-chip{display:flex; align-items:center; gap:7px; font-size:13px; font-weight:700; color:var(--mint);}
.status-chip .d{width:8px; height:8px; border-radius:50%; background:var(--mint);}
.ticket-actions{display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; justify-content:center;}

/* scanner */
.scan-shell{max-width:460px; margin:0 auto; text-align:center;}
.scan-video-wrap{position:relative; border-radius:22px; overflow:hidden; background:#000; aspect-ratio:3/4;}
.scan-video-wrap video{width:100%; height:100%; object-fit:cover;}
.scan-frame{position:absolute; inset:12%; border:3px solid var(--mint); border-radius:20px; box-shadow:0 0 0 2000px rgba(0,0,0,0.35);}
.result-screen{border-radius:24px; padding:36px 24px; color:#fff; text-align:center;}
.result-screen.ok{background:linear-gradient(160deg,#0f9d70,#0a7f5b);}
.result-screen.bad{background:linear-gradient(160deg,#e0384a,#b8202f);}
.result-screen.warn{background:linear-gradient(160deg,#e08a1f,#c26a06);}
.result-icon{width:56px; height:56px; margin:0 auto;}
.result-icon svg{width:100%; height:100%;}
.result-screen h2{font-size:26px; margin-top:10px;}
.result-detail{background:rgba(255,255,255,0.14); border-radius:16px; padding:18px; margin-top:20px; text-align:left;}
.result-detail .row{display:flex; justify-content:space-between; padding:7px 0; font-size:14px; border-bottom:1px solid rgba(255,255,255,0.14);}
.result-detail .row:last-child{border-bottom:none;}

/* table */
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:10px 12px; border-bottom:1.5px solid var(--line);}
td{padding:11px 12px; border-bottom:1px solid var(--line);}
tr:hover td{background:#faf9ff;}
.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:14px;}
.table-wrap table{min-width:640px;}

/* progress bar for event stats */
.pbar{height:8px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:8px;}
.pbar > div{height:100%; background:linear-gradient(90deg,var(--violet),var(--amber)); border-radius:99px;}

/* toast */
#toast-host{position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:10px;}
.toast{background:var(--ink); color:#fff; padding:13px 18px; border-radius:12px; font-size:13.5px; font-weight:600; box-shadow:0 12px 30px -10px rgba(0,0,0,0.4); animation:slideIn .25s ease;}
@keyframes slideIn{from{transform:translateX(30px); opacity:0;} to{transform:translateX(0); opacity:1;}}

/* login */
.login-shell{max-width:400px; margin:60px auto; }
.role-note{background:var(--violet-soft); border:1px solid #ddd3ff; border-radius:12px; padding:12px 14px; font-size:12.5px; color:var(--violet-dim); margin-top:16px;}

/* misc */

<script>
/* ---- visible error catcher: if anything below throws, show it on screen
   instead of leaving a blank page, so we can see the real cause. ---- */
(function(){
  function showError(msg){
    var box = document.getElementById('boot-error');
    if(!box){
      box = document.createElement('div');
      box.id = 'boot-error';
      box.style.cssText = 'position:fixed;inset:0;background:#fff;color:#900;font-family:monospace;font-size:13px;padding:16px;z-index:99999;overflow:auto;white-space:pre-wrap;';
      document.body.appendChild(box);
      box.textContent = 'PAGE ERROR — please screenshot this and send it back:\n\n';
    }
    box.textContent += msg + '\n\n';
  }
  window.addEventListener('error', function(e){
    showError((e.message||'Unknown error') + '\n  at ' + (e.filename||'') + ':' + (e.lineno||'') + ':' + (e.colno||''));
  });
  window.addEventListener('unhandledrejection', function(e){
    showError('Unhandled promise rejection: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason));
  });
  window.addEventListener('load', function(){
    setTimeout(function(){
      var root = document.getElementById('root');
      if(root && root.innerHTML.trim() === '' && !document.getElementById('boot-error')){
        showError('App loaded but #root is still empty after 8 seconds — script may be stuck or blocked.');
      }
    }, 8000);
  });
})();

/* ---- resilient library loading: try several CDNs in sequence -------------
   The scanner previously depended on a single <script src="cdnjs..."> tag in
   <head>. On this event's venue WiFi, cdnjs.cloudflare.com was unreachable,
   so jsQR never loaded and the scanner failed with no way to recover short
   of the visitor manually switching networks. This loads each library from
   multiple independent CDNs, trying the next one if a request fails or is
   slow, so one blocked host doesn't take the whole scanner down. */
function loadScriptWithFallback(urls, globalName, timeoutMs){
  timeoutMs = timeoutMs || 5000;
  return new Promise((resolve, reject) => {
    let i = 0;
    function tryNext(){
      if(window[globalName]){ resolve(window[globalName]); return; }
      if(i >= urls.length){ reject(new Error(globalName + ' failed to load from all sources')); return; }
      const url = urls[i++];
      const s = document.createElement('script');
      s.src = url;
      let done = false;
      const timer = setTimeout(()=>{
        if(done) return; done = true;
        s.remove();
        tryNext();
      }, timeoutMs);
      s.onload = ()=>{
        if(done) return; done = true;
        clearTimeout(timer);
        if(window[globalName]) resolve(window[globalName]);
        else tryNext(); // loaded but didn't define the expected global — try next source
      };
      s.onerror = ()=>{
        if(done) return; done = true;
        clearTimeout(timer);
        s.remove();
        tryNext();
      };
      document.head.appendChild(s);
    }
    tryNext();
  });
}

const jsQRReady = loadScriptWithFallback([
  'https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js',

  'https://unpkg.com/jsqr@1.4.0/dist/jsQR.js',
], 'jsQR').catch(e=>{ console.error(e); return null; });

/* ============================= DATA LAYER ============================= */
/* ---------- BACKEND CONFIG -------------------------------------------------
   This build persists to a Firebase Realtime Database over plain REST calls
   (no SDK, no build step) so the whole app stays a single static HTML file
   you can host anywhere. Fill in your own project's database URL below —
   see the setup steps provided alongside this file. Everything else in the
   app is unchanged. */
const FIREBASE_DB_URL = 'https://techzora2k26-default-rtdb.asia-southeast1.firebasedatabase.app'; // Firebase Realtime Database URL
const DB_PATH = 'techzora2k26-db-v5'; // path/key under which the whole app state is stored
/* ---------- session persistence -----------------------------------------
   Login was only ever kept in an in-memory App.currentUser variable, so any
   page refresh (which people were doing constantly to pick up new
   registrations/payments before live sync existed below) silently logged
   staff back out. This key is used to remember *who* was logged in across
   a refresh; we still re-validate the user against the live DB on load so
   a deactivated account can't stay "logged in" forever. */
const SESSION_KEY = 'techzora2k26_session';
/* ---------- background live sync -----------------------------------------
   Registration desk + hall volunteers were hitting a full page reload every
   time they wanted to see a new registration or a just-authorized payment,
   which is what was also wiping their login (see SESSION_KEY above). This
   polls the DB in the background and silently re-renders — but ONLY on
   read-only screens, and never while a modal/form is open — so nobody's
   half-typed form or the camera scanner gets yanked out from under them. */
const LIVE_SYNC_MS = 4000;
const LIVE_SYNC_SAFE_VIEWS = new Set(['dashboard','registrations','ticket','checkreg','cash','auditlog','halls']);
let db = null;
let scannerStream = null;
let scannerRAF = null;
const VENUE = 'Saravanampatti';

function pad(n,len){ return String(n).padStart(len,'0'); }
function nowISO(){ return new Date().toISOString(); }
function fmtDateTime(iso){ const d = new Date(iso); return d.toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}); }
function fmtTime(iso){ const d = new Date(iso); return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
function uid(prefix){ return prefix + Math.random().toString(36).slice(2,8); }
/* Picks the lowest unused TZ26-##### number instead of always incrementing a
   counter. This means a deleted registration's number becomes available
   again immediately — e.g. delete TZ26-00001 and the very next registration
   reuses TZ26-00001 instead of jumping ahead. */
function nextRegId(){
  const used = new Set();
  (db.registrations||[]).forEach(r=>{
    const m = /^TZ26-(\d+)$/.exec(r.id||'');
    if(m) used.add(parseInt(m[1],10));
  });
  let n = 1;
  while(used.has(n)) n++;
  return `TZ26-${pad(n,5)}`;
}

/* fetch with a hard timeout — on flaky mobile networks a bare fetch() can
   hang indefinitely with no error and no response, which would leave the
   app stuck forever waiting and the page blank. This guarantees we always
   move on within FETCH_TIMEOUT_MS. */
const FETCH_TIMEOUT_MS = 6000;
async function fetchWithTimeout(url, opts={}){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), FETCH_TIMEOUT_MS);
  try{
    return await fetch(url, {...opts, signal: ctrl.signal});
  } finally {
    clearTimeout(t);
  }
}
/* Normalizes records loaded from the database so older/partial records
   (e.g. saved by a previous version of the app, or interrupted writes)
   never crash the UI with "cannot read properties of undefined". */
function sanitizeDB(){
  if(!db) return;
  if(!Array.isArray(db.registrations)) db.registrations = [];
  db.registrations.forEach(r=>{
    if(!Array.isArray(r.selectedEvents)) r.selectedEvents = [];
    r.selectedEvents.forEach(se=>{
      if(!Array.isArray(se.teamMembers)) se.teamMembers = [];
    });
    // refreshment scan (separate from event-entry scan) — one collection per
    // registration, regardless of how many events they're in. Backfills
    // older records that predate this feature.
    if(typeof r.refreshmentStatus !== 'string') r.refreshmentStatus = 'NOT_COLLECTED';
    if(r.refreshmentTime === undefined) r.refreshmentTime = null;
    if(r.refreshmentScannedBy === undefined) r.refreshmentScannedBy = null;
  });
  if(!Array.isArray(db.events)) db.events = [];
  // Cyber Clash (E-Sports) must always be exactly 4 members — enforced here
  // on every load so it self-heals even if older data in Firebase (or a
  // stray manual edit) has a different min/max stored.
  const esports = db.events.find(e=>e.eventId==='ev-esports');
  if(esports){ esports.minTeamSize = 4; esports.maxTeamSize = 4; }
  if(!Array.isArray(db.halls)) db.halls = [];
  if(!Array.isArray(db.users)) db.users = [];
  if(!Array.isArray(db.cashTransactions)) db.cashTransactions = [];
  if(!Array.isArray(db.scanLogs)) db.scanLogs = [];
  if(!Array.isArray(db.auditLogs)) db.auditLogs = [];
  if(typeof db.regCounter !== 'number') db.regCounter = db.registrations.length;
}
async function loadDB(){
  try{
    const res = await fetchWithTimeout(`${FIREBASE_DB_URL}/${DB_PATH}.json`);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if(data){
      db = data;
      sanitizeDB();
    } else {
      db = seedDB();
      await saveDB();
    }
  }catch(e){
    console.error('load failed', e);
    if(!db) db = seedDB(); // only fall back to a blank seed if nothing is loaded at all
  }
}
async function saveDB(){
  try{
    const res = await fetchWithTimeout(`${FIREBASE_DB_URL}/${DB_PATH}.json`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(db),
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
  }catch(e){
    console.error('save failed', e);
    if(typeof App !== 'undefined') App.toast('⚠️ Could not save — check your internet connection and try again');
  }
}
/* Pulls the latest server copy of the database into memory. Called at the
   start of every action that reads-then-writes shared counters or shared
   records (registration numbers, payment authorization, scan results) so
   that two devices acting at the same moment don't clobber each other. */
async function refreshDB(){
  try{
    const res = await fetchWithTimeout(`${FIREBASE_DB_URL}/${DB_PATH}.json`);
    if(res.ok){
      const data = await res.json();
      if(data){ db = data; sanitizeDB(); }
    }
  }catch(e){ console.error('refresh failed — continuing with local copy', e); }
}

/* Keeps the in-memory DB current without anyone having to reload the page.
   Runs continuously in the background; every tick it pulls the latest data
   and — only when it's safe to do so — re-renders. "Safe" means: a
   read-mostly screen (so a new registration/authorized payment just shows
   up), and no modal or in-progress form is currently open, so nobody typing
   a registration or mid-scan loses their place. The scanner screen manages
   its own refreshDB() calls per-scan already and is deliberately excluded
   here since re-rendering it would tear down the live camera feed. */
let liveSyncTimer = null;
function startLiveSync(){
  if(liveSyncTimer) return;
  liveSyncTimer = setInterval(async ()=>{
    if(document.hidden) return; // don't burn requests on a backgrounded tab
    const beforeJSON = JSON.stringify(db);
    await refreshDB();
    if(!App.modal && LIVE_SYNC_SAFE_VIEWS.has(App.view)){
      if(JSON.stringify(db) !== beforeJSON) App.render();
    }
  }, LIVE_SYNC_MS);
}

/* Escapes user-entered text before it's echoed back into an HTML template
   string. Without this, a team/member name containing a double-quote, <, >,
   or & (e.g. Team "Titans", O'Brien & Co, <script>) corrupts the markup on
   the next re-render — the browser silently truncates/misparses the tag,
   which is what makes fields (and anything after them) appear to vanish
   with no console error. Apply to EVERY piece of user-entered data placed
   inside a template literal, whether in a value="" attribute or as element
   text content. */
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}

/* ============================= LOOKUP HELPERS ============================= */
function getEvent(id){ return db.events.find(e=>e.eventId===id); }
function getHall(id){ return db.halls.find(h=>h.id===id); }
function getUser(id){ return db.users.find(u=>u.id===id); }
function userName(id){
  if(!id) return '—';
  if(id==='SYSTEM') return 'System';
  const u = getUser(id); return u ? u.name : id;
}
function hallName(id){ const h = getHall(id); return h ? h.name : id; }
function eventName(id){ const e = getEvent(id); return e ? e.eventName : id; }
function regEventCount(eventId){
  return db.registrations.filter(r=>r.status==='REGISTERED' && r.selectedEvents.some(se=>se.eventId===eventId)).length;
}
function badgeHTML(status){
  const map = {
    PAID:'paid', PENDING:'pending', ENTERED:'entered', REGISTERED:'registered',
    CANCELLED:'cancelled', ACTIVE:'active', USED:'used', NOT_ENTERED:'notentered',
  };
  const cls = map[status] || 'registered';
  const label = String(status).replace(/_/g,' ');
  return `<span class="badge ${cls}">${label}</span>`;
}
function sessionPill(session){ return `<span class="session-pill ${session}">${session}</span>`; }
/* ---------- payment-authorization badges ---------- */
function paymentBadgeHTML(reg){

    return `<span class="badge paid">✓ PAID &amp; VERIFIED</span>`;
  }
  return `<span class="badge pending">PAYMENT PENDING</span>`;
}

}

/* ============================= APP STATE ============================= */
const App = {
  view: 'landing',
  params: {},
  currentUser: null,
  scannerActive: false,
  scanResult: null,
  scanMode: 'ENTRY', // 'ENTRY' (hall entry pass) or 'REFRESHMENT' (refreshment collection)
  setScanMode(mode){
    if(this.scanMode === mode) return;
    this.scanMode = mode;
    this.scanResult = null;
    this.stopScanner();
    this.render();
  },
  modal: null,
  regWizard: { primaryEventId:null, wantsSecond:null, secondaryEventId:null, membersText:{} },

  async init(){
    await loadDB();
    this.restoreSession();
    this.render();
    startLiveSync();
  },
  /* Re-attach a previously logged-in staff member after a refresh (or the
     browser being reopened) by looking up the saved user id against the
     freshly-loaded DB. If the account no longer exists or was deactivated,
     the stale session is dropped and they land back on the login screen. */
  restoreSession(){
    let savedId = null;
    try{ savedId = localStorage.getItem(SESSION_KEY); }catch(e){ /* storage may be blocked — just skip restore */ }
    if(!savedId) return;
    const u = db.users.find(v=>v.id===savedId && v.active);
    if(u){
      this.currentUser = u;
      this.view = (u.role==='VOLUNTEER') ? 'scanner' : 'dashboard';
    } else {
      try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
    }
  },
  nav(view, params={}){
    if(view==='register' || view==='register-desk') this.regWizard = { primaryEventId: params.eventId || null, wantsSecond:null, secondaryEventId:null, membersText:{} };
    this.view = view; this.params = params;
    window.scrollTo(0,0);
    this.render();
  },
  toast(msg){
    const host = document.getElementById('toast-host');
    const el = document.createElement('div');
    el.className='toast'; el.textContent=msg;
    host.appendChild(el);
    setTimeout(()=>el.remove(), 3200);
  },
  modalMsg(title, body){ this.openModal(`<div class="modal"><h3 style="margin-bottom:12px;">${title}</h3><p class="muted small" style="line-height:1.6;">${body}</p><button class="btn btn-primary btn-block" style="margin-top:18px;" onclick="App.closeModal()">OK</button></div>`); },

  /* ---------- auth ---------- */
  login(username, password){
    const u = db.users.find(v=>v.username===username && v.password===password && v.active);
    if(!u){ this.toast('Invalid username or password'); return; }
    this.currentUser = u;
    try{ localStorage.setItem(SESSION_KEY, u.id); }catch(e){ /* storage may be blocked — login still works for this tab */ }
    this.toast(`Welcome back, ${u.name.split(' ')[0]}`);
    this.audit(u, 'LOGIN', u.id, '');
    if(u.role==='VOLUNTEER') this.nav('scanner');
    else this.nav('dashboard');
  },
  logout(){
    this.stopScanner();
    this.currentUser = null;
    try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
    this.nav('landing');
  },
  requireRole(roles){
    return this.currentUser && roles.includes(this.currentUser.role);
  },

  /* ---------- audit ---------- */
  audit(user, action, target, reason){
    db.auditLogs.push({
      user: user ? user.name : 'SYSTEM', role: user ? user.role : 'SYSTEM',
      action, target: target || '', reason: reason || '', timestamp: nowISO(),
    });
  },

  /* ---------- registration wizard state ---------- */
  setPrimaryEvent(id){
    this.regWizard.primaryEventId = id || null;
    this.regWizard.wantsSecond = null;
    this.regWizard.secondaryEventId = null;
    this.render();
  },
  /* Belt-and-braces: pull whatever is currently sitting in any team-member
     textarea AND any of the plain team-detail inputs (name, college, leader,
     phone, department) on screen into regWizard state right before we tear
     the DOM down for a re-render. oninput already keeps these in sync on
     every keystroke, but this guarantees it even for an in-progress
     composition (e.g. a regional-language keyboard) that hasn't fired
     'input' yet. */
  flushMembersFields(){
    document.querySelectorAll('textarea[name^="members_"]').forEach(el=>{
      this.regWizard.membersText[el.name.slice('members_'.length)] = el.value;
    });
    ['teamName','college','leaderName','leaderPhone','department'].forEach(f=>{
      const el = document.querySelector(`#reg-form [name="${f}"]`);
      if(el) this.regWizard[f] = el.value;
    });
  },
  setWantsSecond(val){
    this.flushMembersFields();
    this.regWizard.wantsSecond = val;
    if(!val) this.regWizard.secondaryEventId = null;
    this.render();
  },
  setSecondaryEvent(id){
    this.flushMembersFields();
    this.regWizard.secondaryEventId = id || null;
    this.render();
  },
  /* Saves typed team-member text into wizard state as the person types, so
     a later re-render (choosing "add a second event", picking that event,
     etc.) never wipes out what they already entered. Deliberately does NOT
     call render() — that would rebuild the DOM on every keystroke and kill
     the textarea's cursor position. */
  setMembersText(eventId, val){
    this.regWizard.membersText[eventId] = val;
  },
  /* Same idea, for the plain team-detail fields (team name, college, leader
     name/phone, department) above the event picker. These used to have no
     state binding at all, so ANY re-render — e.g. tapping "Yes" to add a
     second event — silently wiped them back to blank even though the event
     selection itself survived. Does NOT call render(), for the same reason
     as setMembersText above. */
  setRegField(field, val){
    this.regWizard[field] = val;
  },

  /* ---------- validation (shared by frontend + "server" — same code path,
     always re-run at submit time so the UI state can never be trusted) ---------- */
  validateCombo(primaryId, secondaryId){
    const p = getEvent(primaryId);
    if(!p) return {ok:false, msg:'Please select a primary event.'};
    if(!secondaryId) return {ok:true};
    if(secondaryId === primaryId) return {ok:false, msg:'The second event must be different from the primary event.'};
    const s = getEvent(secondaryId);
    if(!s) return {ok:false, msg:'Invalid second event selected.'};
    if(s.session === p.session) return {ok:false, msg:`You cannot select two ${p.session} events. The second event must be from the opposite session.`};
    return {ok:true};
  },
  validateTeamSize(eventId, members){
    const ev = getEvent(eventId);
    const n = members.length;
    if(n < ev.minTeamSize || n > ev.maxTeamSize){
      return {ok:false, msg:`${ev.eventName} allows ${ev.minTeamSize}-${ev.maxTeamSize} members. You entered ${n}.`};
    }
    return {ok:true};
  },
  validateCapacity(eventIds){
    for(const id of eventIds){
      const ev = getEvent(id);
      const count = regEventCount(id);
      if(count >= ev.capacity) return {ok:false, msg:`${ev.eventName} has reached its maximum capacity (${ev.capacity}). Registration cannot be accepted for this event.`};
    }
    return {ok:true};
  },
  findDuplicate(phone){
    return db.registrations.find(r=>r.status==='REGISTERED' && r.leaderPhone === phone);
  },

  /* ---------- registration submission (this function is the single source of
     truth for creating a registration; the form above is convenience UI only) ---------- */
  async submitRegistration(form, opts={}){
    await refreshDB(); // pull latest reg counter / capacity before validating, since other devices may be registering at the same time
    const primaryId = form.primaryEventId;
    const secondaryId = form.secondaryEventId || null;

    const combo = this.validateCombo(primaryId, secondaryId);
    if(!combo.ok){ this.toast(combo.msg); return; }

    const eventIds = secondaryId ? [primaryId, secondaryId] : [primaryId];

    // per-event team members
    const eventsData = [];
    for(const id of eventIds){
      const raw = form['members_'+id] || '';
      const members = raw.split(',').map(s=>s.trim()).filter(Boolean);
      const sizeCheck = this.validateTeamSize(id, members);
      if(!sizeCheck.ok){ this.toast(sizeCheck.msg); return; }
      const ev = getEvent(id);
      eventsData.push({
        eventId: ev.eventId, eventName: ev.eventName, session: ev.session,
        startTime: ev.startTime, endTime: ev.endTime, hallId: ev.hallId,
        teamMembers: members, entryStatus:'NOT_ENTERED', entryTime:null, scannedBy:null,
      });
    }

    const capCheck = this.validateCapacity(eventIds);
    if(!capCheck.ok){ this.toast(capCheck.msg); return; }

    if(!form.teamName || !form.leaderName || !form.leaderPhone || !form.college || !form.department){
      this.toast('Please fill in all required team details.'); return;
    }

    // duplicate protection
    if(!opts.forceOverride){
      const dup = this.findDuplicate(form.leaderPhone);
      if(dup){
        if(this.requireRole(['SUPER_ADMIN'])){
          const proceed = confirm(`A registration already exists for this phone number (${dup.id} — ${dup.teamName}). This looks like a possible duplicate. Continue anyway as Super Admin?`);
          if(!proceed) return;
          const reason = prompt('Override reason (required):','Duplicate reviewed — genuine second registration confirmed by Super Admin');
          if(!reason){ this.toast('Override cancelled — reason is required.'); return; }
          this.audit(this.currentUser, 'SUPER_ADMIN_OVERRIDE_DUPLICATE', dup.id, reason);
        } else {
          this.modalMsg('POSSIBLE DUPLICATE REGISTRATION', `A registration already exists for phone number <b>${form.leaderPhone}</b> (Registration ID <span class="mono">${dup.id}</span>, Team "${dup.teamName}"). Please contact the Super Admin at the registration desk if this is a genuine second registration.`);
          return;
        }
      }
    }

    const regId = nextRegId();

    // Every registration — public or desk-entered — is created PENDING.
    // A public user can never mark their own payment as paid; only an
    // authenticated ADMIN / SUPER_ADMIN can authorize it afterwards via
    // App.authorizePayment(), once cash has actually been received.
    const reg = {
      id: regId,
      teamName: form.teamName, leaderName: form.leaderName, leaderPhone: form.leaderPhone,
      college: form.college, department: form.department,
      paymentStatus:'PENDING', paymentAuthorized:false,
      paymentAuthorizedBy:null, paymentAuthorizedAt:null,
      amount:100, qrCode: regId,
      status:'REGISTERED',
      refreshmentStatus:'NOT_COLLECTED', refreshmentTime:null, refreshmentScannedBy:null,
      createdAt: nowISO(), createdBy: this.currentUser ? this.currentUser.id : 'PUBLIC_SELF_SERVICE',
      selectedEvents: eventsData,
    };
    db.registrations.push(reg);

    this.audit(this.currentUser, 'REGISTRATION_CREATED', regId, '');
    await saveDB();
    this.toast('Registration successful — payment pending');
    this.nav('ticket', {regId});
  },

  findReg(idOrPhone){
    const q = (idOrPhone||'').trim().toUpperCase();
    return db.registrations.find(r=>r.id===q) || db.registrations.find(r=>r.leaderPhone===idOrPhone.trim());
  },

  /* ---------- cash payment authorization (Admin / Super Admin only) ----------
     This is the single place a registration can ever move from PENDING to
     PAID. It is only reachable from the admin-side confirmation modal, never
     from public UI, and it is idempotent: once a cash transaction exists for
     a registration, re-clicking cannot create a second one. */
  async authorizePayment(regId){
    if(!this.requireRole(['ADMIN','SUPER_ADMIN'])){ this.toast('ACCESS DENIED'); return; }
    await refreshDB(); // make sure another admin hasn't already authorized this in the meantime
    const reg = db.registrations.find(r=>r.id===regId);
    if(!reg){ this.toast('Registration not found'); return; }

    // duplicate-payment protection — belt & suspenders around the button
    // already being removed once authorized
    const existingTxn = db.cashTransactions.find(t=>t.regId===regId);
    if(reg.paymentAuthorized && reg.paymentStatus==='PAID' && existingTxn){
      this.toast('✓ Payment already authorized for this registration');
      this.closeModal();
      return;
    }

    reg.paymentStatus = 'PAID';
    reg.paymentAuthorized = true;
    reg.paymentAuthorizedBy = this.currentUser.id;
    reg.paymentAuthorizedAt = nowISO();

    if(!existingTxn){
      db.cashTransactions.push({
        id: uid('cash-'),
        regId: reg.id,
        teamName: reg.teamName,
        amount: reg.amount,
        method: 'CASH',
        authorizedBy: this.currentUser.id,
        authorizedAt: reg.paymentAuthorizedAt,
      });
    }

    this.audit(this.currentUser, 'PAYMENT_AUTHORIZED', regId, `₹${reg.amount} cash received`);
    await saveDB();
    this.toast(`Payment authorized — ${reg.teamName}`);
    this.closeModal();
    this.render();
  },

  /* ---------- QR scanner ---------- */
  async startScanner(){
    const video = document.getElementById('scanner-video');
    if(!video) return;
    // The QR decoder (jsQR) loads from a CDN. On flaky event WiFi one CDN can
    // fail while the camera (which is fully local) still works fine — that
    // used to make the scanner look "stuck" with no error. jsQRReady tries
    // several CDNs in sequence before giving up, so wait for that to settle.
    if(typeof jsQR === 'undefined'){
      this.toast('Loading QR scanner…');
      await jsQRReady;
    }
    if(typeof jsQR === 'undefined'){
      this.toast('QR scanner could not load from any source (no internet?). Use manual entry below, or reload once you have signal.');
      return;
    }
    try{
      scannerStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      video.srcObject = scannerStream;
      await video.play();
      this.scannerActive = true;
      this.scanErrorShown = false;
      this.scanLoop();
    }catch(e){
      this.toast('Camera access denied or unavailable');
    }
  },
  scanLoop(){
    const video = document.getElementById('scanner-video');
    const canvas = document.getElementById('scanner-canvas');
    if(!video || !canvas || !this.scannerActive) return;
    try{
      const ctx = canvas.getContext('2d');
      if(video.readyState === video.HAVE_ENOUGH_DATA){
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video,0,0,canvas.width,canvas.height);
        const img = ctx.getImageData(0,0,canvas.width,canvas.height);
        const code = jsQR(img.data, img.width, img.height);
        if(code && code.data){
          this.stopScanner();
          this.processScan(code.data);
          return;
        }
      }
    }catch(e){
      // Previously an error here (e.g. jsQR missing/misfiring) would silently
      // kill the loop forever — camera stays on, nothing ever gets scanned
      // again, with no indication anything went wrong. Now we surface it once
      // and keep retrying instead of dying permanently.
      console.error('Scan frame error:', e);
      if(!this.scanErrorShown){
        this.scanErrorShown = true;
        this.toast('Scanner hit an error and is retrying — if this repeats, use manual entry.');
      }
    }
    scannerRAF = requestAnimationFrame(()=>this.scanLoop());
  },
  stopScanner(){
    this.scannerActive = false;
    if(scannerRAF) cancelAnimationFrame(scannerRAF);
    if(scannerStream){ scannerStream.getTracks().forEach(t=>t.stop()); scannerStream=null; }
  },

  /* The volunteer never picks a hall or event manually — both come from
     their assigned account, per "never ask a volunteer to make a decision
     the system can make automatically". */
  logScan(reg, ev, result, reason){
    const vol = this.currentUser;
    db.scanLogs.push({
      regId: reg ? reg.id : (typeof reg === 'string' ? reg : null),
      teamName: reg ? reg.teamName : null,
      eventId: ev ? ev.eventId : (vol ? vol.eventId : null),
      eventName: ev ? ev.eventName : null,
      session: ev ? ev.session : null,
      hallId: vol ? vol.hallId : null,
      volunteerId: vol ? vol.id : null,
      timestamp: nowISO(),
      result, reason,
    });
  },
  isWithinWindow(ev){
    const now = new Date();
    const [sh,sm] = ev.startTime.split(':').map(Number);
    const [eh,em] = ev.endTime.split(':').map(Number);
    const start = new Date(now); start.setHours(sh,sm,0,0);
    const end = new Date(now); end.setHours(eh,em,0,0);
    if(now < start) return 'EARLY';
    if(now > end) return 'CLOSED';
    return 'OPEN';
  },
  async processScan(token){
    if(this.scanMode === 'REFRESHMENT') return this.processRefreshmentScan(token);
    await refreshDB(); // pick up the latest payment-authorization / entry state from other devices before deciding
    const vol = this.currentUser;
    const volEvent = getEvent(vol.eventId);
    const rawId = (token||'').trim().toUpperCase();
    const reg = db.registrations.find(r=>r.id === rawId);

    // CHECK 1 — QR validity
    if(!reg){
      this.logScan(rawId, null, 'REJECTED', 'INVALID_QR');
      this.scanResult = {type:'INVALID'}; this.render(); return;
    }
    // CHECK 2 — registration status
    if(reg.status === 'CANCELLED'){
      this.logScan(reg, volEvent, 'REJECTED', 'REGISTRATION_CANCELLED');
      this.scanResult = {type:'CANCELLED', reg}; this.render(); return;
    }
    // CHECK 3 — payment authorization (must be BOTH paid AND admin-authorized)
    if(!(reg.paymentStatus === 'PAID' && reg.paymentAuthorized === true)){
      this.logScan(reg, volEvent, 'REJECTED', 'PAYMENT_NOT_AUTHORIZED');
      this.scanResult = {type:'PAYMENT_NOT_AUTHORIZED', reg}; this.render(); return;
    }
    // CHECK 4 — event
    const se = reg.selectedEvents.find(x=>x.eventId === vol.eventId);
    if(!se){
      this.logScan(reg, volEvent, 'REJECTED', 'EVENT_NOT_SELECTED');
      this.scanResult = {type:'NOT_THIS_EVENT', reg}; this.render(); return;
    }
    // CHECK 5 — hall
    if(se.hallId !== vol.hallId){
      this.logScan(reg, volEvent, 'REJECTED', 'WRONG_HALL');
      this.scanResult = {type:'WRONG_HALL', reg, se}; this.render(); return;
    }
    // CHECK 6 — time window
    const win = this.isWithinWindow(volEvent);
    if(win === 'EARLY'){
      this.logScan(reg, volEvent, 'REJECTED', 'EVENT_NOT_OPEN');
      this.scanResult = {type:'TOO_EARLY', reg, se}; this.render(); return;
    }
    if(win === 'CLOSED'){
      this.logScan(reg, volEvent, 'REJECTED', 'EVENT_CLOSED');
      this.scanResult = {type:'CLOSED', reg, se}; this.render(); return;
    }
    // CHECK 7 — duplicate entry (per event only)
    if(se.entryStatus === 'ENTERED'){
      this.logScan(reg, volEvent, 'REJECTED', 'ALREADY_ENTERED');
      this.scanResult = {type:'ALREADY_ENTERED', reg, se}; this.render(); return;
    }
    // CHECK 8 — valid entry
    this.scanResult = {type:'VALID', reg, se};
    this.render();
  },
  async confirmEntry(){
    const {reg, se} = this.scanResult;
    se.entryStatus = 'ENTERED';
    se.entryTime = nowISO();
    se.scannedBy = this.currentUser.id;
    this.logScan(reg, getEvent(se.eventId), 'APPROVED', '');
    await saveDB();
    this.toast(`Entry confirmed — ${reg.teamName}`);
    this.scanResult = null;
    this.render();
  },
  scanAgain(){ this.scanResult = null; this.render(); this.startScanner(); },

  /* ---------- Refreshment scan — same QR code as entry, but a separate,
     one-time-per-registration check (not per event). Any hall volunteer's
     scanner can do this once switched into "Refreshment" mode. ---------- */
  async processRefreshmentScan(token){
    await refreshDB();
    const rawId = (token||'').trim().toUpperCase();
    const reg = db.registrations.find(r=>r.id === rawId);

    if(!reg){
      this.logScan(rawId, null, 'REJECTED', 'INVALID_QR_REFRESHMENT');
      this.scanResult = {type:'INVALID'}; this.render(); return;
    }
    if(reg.status === 'CANCELLED'){
      this.logScan(reg, null, 'REJECTED', 'REGISTRATION_CANCELLED_REFRESHMENT');
      this.scanResult = {type:'CANCELLED', reg}; this.render(); return;
    }
    if(!(reg.paymentStatus === 'PAID' && reg.paymentAuthorized === true)){
      this.logScan(reg, null, 'REJECTED', 'PAYMENT_NOT_AUTHORIZED_REFRESHMENT');
      this.scanResult = {type:'PAYMENT_NOT_AUTHORIZED', reg}; this.render(); return;
    }
    if(reg.refreshmentStatus === 'COLLECTED'){
      this.logScan(reg, null, 'REJECTED', 'ALREADY_COLLECTED_REFRESHMENT');
      this.scanResult = {type:'ALREADY_COLLECTED', reg}; this.render(); return;
    }
    this.scanResult = {type:'REFRESHMENT_VALID', reg};
    this.render();
  },
  async confirmRefreshment(){
    const {reg} = this.scanResult;
    reg.refreshmentStatus = 'COLLECTED';
    reg.refreshmentTime = nowISO();
    reg.refreshmentScannedBy = this.currentUser.id;
    this.logScan(reg, null, 'REFRESHMENT_APPROVED', '');
    await saveDB();
    this.toast(`Refreshment collected — ${reg.teamName}`);
    this.scanResult = null;
    this.render();
  },

  /* ---------- Super Admin override ---------- */
  async superAdminOverride(){
    if(!this.requireRole(['SUPER_ADMIN'])){ this.toast('ACCESS DENIED'); return; }
    const {reg, se} = this.scanResult || {};
    if(!reg || !se) return;
    const reason = prompt('Override reason (required) — e.g. "QR damaged — participant identity verified manually":');
    if(!reason){ this.toast('Override cancelled — reason is required.'); return; }
    se.entryStatus = 'ENTERED';
    se.entryTime = nowISO();
    se.scannedBy = this.currentUser.id;
    this.audit(this.currentUser, 'SUPER_ADMIN_OVERRIDE_ENTRY', reg.id, reason);
    this.logScan(reg, getEvent(se.eventId), 'OVERRIDE_APPROVED', reason);
    await saveDB();
    this.toast(`Entry approved by override — ${reg.teamName}`);
    this.scanResult = null;
    this.render();
  },

  /* ---------- events / halls / users CRUD (role-gated) ---------- */
  async updateEvent(id,f){
    if(!this.requireRole(['SUPER_ADMIN'])){ this.toast('ACCESS DENIED'); return; }
    await refreshDB();
    const ev = getEvent(id);
    Object.assign(ev,{
      eventName:f.eventName, session:f.session, startTime:f.startTime, endTime:f.endTime,
      minTeamSize:Number(f.minTeamSize), maxTeamSize:Number(f.maxTeamSize),
      hallId:f.hallId, capacity:Number(f.capacity),
    });
    this.audit(this.currentUser, 'EVENT_CONFIGURATION_CHANGED', id, '');
    await saveDB(); this.toast('Event updated'); this.closeModal();
  },
  async addUser(f){
    if(!this.requireRole(['SUPER_ADMIN'])){ this.toast('ACCESS DENIED'); return; }
    if(f.role==='SUPER_ADMIN'){ this.toast('Only one Super Admin is permitted.'); return; }
    await refreshDB();
    const id = uid('u-');
    db.users.push({id, name:f.name, username:f.username, password:f.password, role:f.role,
      hallId: f.role==='VOLUNTEER' ? f.hallId : null,
      eventId: f.role==='VOLUNTEER' ? f.eventId : null, active:true});
    this.audit(this.currentUser, f.role==='ADMIN' ? 'ADMIN_CREATED' : 'VOLUNTEER_CREATED', id, '');
    await saveDB(); this.toast('Account created'); this.closeModal();
  },
  async toggleUser(id){
    if(!this.requireRole(['SUPER_ADMIN'])){ this.toast('ACCESS DENIED'); return; }
    await refreshDB();
    const u = getUser(id);
    if(u.role==='SUPER_ADMIN'){ this.toast('The Super Admin account cannot be deactivated.'); return; }
    u.active = !u.active;
    this.audit(this.currentUser, u.active ? (u.role==='ADMIN'?'ADMIN_CREATED':'VOLUNTEER_CREATED') : (u.role==='ADMIN'?'ADMIN_DEACTIVATED':'VOLUNTEER_DEACTIVATED'), id, '');
    await saveDB(); this.toast(u.active?'Account activated':'Account deactivated'); this.render();
  },
  async assignVolunteer(id, hallId, eventId){
    if(!this.requireRole(['SUPER_ADMIN'])){ this.toast('ACCESS DENIED'); return; }
    await refreshDB();
    const u = getUser(id);
    u.hallId = hallId; u.eventId = eventId;
    this.audit(this.currentUser, 'VOLUNTEER_ASSIGNED', id, `Hall ${hallName(hallId)} / ${eventName(eventId)}`);
    await saveDB(); this.toast('Volunteer assignment updated'); this.closeModal();
  },

  /* ---------- admin editing of a registration ---------- */
  async updateRegistration(regId, f){
    if(!this.requireRole(['ADMIN','SUPER_ADMIN'])){ this.toast('ACCESS DENIED'); return; }
    await refreshDB();
    const reg = db.registrations.find(r=>r.id===regId);
    if(!reg){ this.toast('Registration not found'); return; }

    reg.teamName = f.teamName; reg.leaderName = f.leaderName; reg.leaderPhone = f.leaderPhone;
    reg.college = f.college; reg.department = f.department;

    for(const se of reg.selectedEvents){
      if(se.entryStatus === 'ENTERED'){
        // entry already recorded for this event — member list is locked
        continue;
      }
      const raw = f['members_'+se.eventId];
      if(raw === undefined) continue;
      const members = raw.split(',').map(s=>s.trim()).filter(Boolean);
      const check = this.validateTeamSize(se.eventId, members);
      if(!check.ok){ this.toast(check.msg); return; }
      se.teamMembers = members;
    }

    this.audit(this.currentUser, 'REGISTRATION_EDITED', regId, '');
    await saveDB(); this.toast('Registration updated'); this.closeModal(); this.render();
  },
  async cancelRegistration(regId){
    if(!this.requireRole(['SUPER_ADMIN'])){ this.toast('ACCESS DENIED — only the Super Admin can cancel registrations.'); return; }
    const reason = prompt('Cancellation reason (required):');
    if(!reason){ this.toast('Cancellation aborted — reason is required.'); return; }
    await refreshDB();
    const reg = db.registrations.find(r=>r.id===regId);
    reg.status = 'CANCELLED';
    this.audit(this.currentUser, 'REGISTRATION_CANCELLED', regId, reason);
    await saveDB(); this.toast('Registration cancelled'); this.render();
  },
  /* Permanent delete — different from cancelRegistration above, which only
     flags status and keeps the record for the audit trail. This actually
     removes the registration from the database. Super Admin only. Just a
     single confirm dialog — no reason prompt, no typing the ID. */
  async deleteRegistration(regId){
    if(!this.requireRole(['SUPER_ADMIN'])){ this.toast('ACCESS DENIED — only the Super Admin can delete registrations.'); return; }
    await refreshDB();
    const reg = db.registrations.find(r=>r.id===regId);
    if(!reg){ this.toast('Registration not found'); return; }
    const ok = confirm(`Delete registration ${reg.id} ("${reg.teamName}")? This cannot be undone.`);
    if(!ok) return;

    // Deleting a registration must also remove its cash-collected record —
    // otherwise "Total cash collected" on the Cash Management page keeps
    // counting money for a registration that no longer exists. The amount
    // (if any was collected) is preserved in the audit log below so there's
    // still a permanent record that cash was received before the deletion.
    const existingTxn = db.cashTransactions.find(t=>t.regId===regId);
    const cashNote = existingTxn ? ` — ₹${existingTxn.amount} cash record removed (was authorized by ${userName(existingTxn.authorizedBy)} on ${existingTxn.authorizedAt})` : '';
    db.cashTransactions = db.cashTransactions.filter(t=>t.regId!==regId);

    this.audit(this.currentUser, 'REGISTRATION_DELETED', reg.id, `team: ${reg.teamName}, phone: ${reg.leaderPhone}${cashNote}`);
    db.registrations = db.registrations.filter(r=>r.id!==regId);
    await saveDB(); this.toast(`Registration permanently deleted${existingTxn?' — cash record removed too':''}`); this.render();
  },

  /* Reset the cash-collected tally to ₹0 — Super Admin only. This clears
     the cash transaction log (what Dashboard / Cash Management add up),
     but deliberately does NOT touch reg.paymentStatus / reg.paymentAuthorized
     on individual registrations, so already-issued QR passes stay valid.
     Use this after physically counting & banking the cash for a period. */
  async resetCashCollected(){
    if(!this.requireRole(['SUPER_ADMIN'])){ this.toast('ACCESS DENIED — only the Super Admin can reset cash records.'); return; }
    await refreshDB();
    const total = db.cashTransactions.reduce((s,t)=>s+t.amount,0);
    const count = db.cashTransactions.length;
    if(!count){ this.toast('Cash collected is already ₹0'); return; }
    const confirmTxt = prompt(`This clears the entire cash-collected log (₹${total.toLocaleString()} across ${count} transactions) back to ₹0. Registrations' payment status and QR passes are NOT affected.\n\nType RESET to confirm:`);
    if(confirmTxt !== 'RESET'){ this.toast('Reset aborted.'); return; }
    db.cashTransactions = [];
    this.audit(this.currentUser, 'CASH_COLLECTED_RESET', 'ALL', `Cleared ₹${total.toLocaleString()} across ${count} transactions`);
    await saveDB();
    this.toast('Cash collected reset to ₹0');
    this.render();
  },

  modal: null,
  openModal(html){ this.modal = html; this.render(); },
  closeModal(){ this.modal = null; this.render(); },

  exportCSV(){
    const rows = [['Registration ID','Team Name','Leader','Phone','College','Department','Payment Status','Payment Authorized','Authorized By','Authorized At','Amount',
      'Primary Event','Primary Session','Primary Hall','Primary Event Members','Primary Entry Status','Primary Entry Time','Primary Scanned By',
      'Second Event','Second Session','Second Hall','Second Event Members','Second Entry Status','Second Entry Time','Second Scanned By',
      'Refreshment Status','Refreshment Time','Refreshment Scanned By','Created At']];
    db.registrations.forEach(r=>{
      const p = r.selectedEvents[0]; const s = r.selectedEvents[1];
      rows.push([
        r.id, r.teamName, r.leaderName, r.leaderPhone, r.college, r.department, r.paymentStatus,
        r.paymentAuthorized ? 'YES' : 'NO', r.paymentAuthorizedBy ? userName(r.paymentAuthorizedBy) : '', r.paymentAuthorizedAt ? r.paymentAuthorizedAt : '', r.amount,
        p?p.eventName:'', p?p.session:'', p?hallName(p.hallId):'', p?p.teamMembers.join('; '):'', p?p.entryStatus:'', p&&p.entryTime?fmtDateTime(p.entryTime):'', p&&p.scannedBy?userName(p.scannedBy):'',
        s?s.eventName:'NO ADDITIONAL EVENT', s?s.session:'', s?hallName(s.hallId):'', s?s.teamMembers.join('; '):'', s?s.entryStatus:'', s&&s.entryTime?fmtDateTime(s.entryTime):'', s&&s.scannedBy?userName(s.scannedBy):'',
        r.refreshmentStatus, r.refreshmentTime?fmtDateTime(r.refreshmentTime):'', r.refreshmentScannedBy?userName(r.refreshmentScannedBy):'',
        r.createdAt,
      ]);
    });
    const csv = rows.map(row=>row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='techzora2k26_registrations.csv'; a.click();
    URL.revokeObjectURL(url);
    this.toast('CSV exported');
  },
  exportCashCSV(){
    const rows = [['Registration ID','Team Name','Amount','Method','Authorized By','Authorized At']];
    db.cashTransactions.forEach(t=>{
      rows.push([t.regId, t.teamName, t.amount, t.method, userName(t.authorizedBy), t.authorizedAt]);
    });
    const csv = rows.map(row=>row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='techzora2k26_cash_transactions.csv'; a.click();
    URL.revokeObjectURL(url);
    this.toast('Cash CSV exported');
  },

  render(){
    // Preserve scroll position across re-renders. Swapping #root's innerHTML
    // briefly shrinks the document, which makes mobile browsers snap the
    // scroll to the top and NOT restore it — so anything below the fold
    // (like an already-filled-in FN team-members box) looks like it vanished
    // when you're mid-way through the "add a second event" flow. Capturing
    // and restoring scrollY here fixes that without touching any form state.
    const scrollY = window.scrollY;
    document.getElementById('root').innerHTML = renderApp();
    attachPostRenderHooks();
    window.scrollTo(0, scrollY);
  }
};

function eventSelectionForm(){
  const w = App.regWizard;
  const primary = w.primaryEventId ? getEvent(w.primaryEventId) : null;
  const oppositeEvents = primary ? db.events.filter(e=>e.session !== primary.session) : [];

  let html = `<div class="field"><label>Primary event — choose exactly one *</label>
    <div class="radio-card-group">
      ${db.events.map(ev=>`
        <label class="radio-card ${w.primaryEventId===ev.eventId?'selected':''}">
          <input type="radio" name="primaryEventPicker" value="${ev.eventId}" ${w.primaryEventId===ev.eventId?'checked':''} onchange="App.setPrimaryEvent('${ev.eventId}')">
          <div class="rc-body"><b>${ev.eventName} ${sessionPill(ev.session)}</b><span>${ev.startTime}–${ev.endTime} · Team ${ev.minTeamSize}-${ev.maxTeamSize} · ${hallName(ev.hallId)}</span></div>
        </label>`).join('')}
    </div>
  </div>`;

  if(primary){
    html += `<div class="event-subform">
      <label style="display:block; font-size:13px; font-weight:600; margin-bottom:8px;">${primary.eventName} — team members *</label>
      <textarea name="members_${primary.eventId}" required oninput="App.setMembersText('${primary.eventId}', this.value)" placeholder="Member names, comma-separated (min ${primary.minTeamSize}, max ${primary.maxTeamSize})">${escapeHtml(w.membersText[primary.eventId] || '')}</textarea>
      <div class="hint">Between ${primary.minTeamSize} and ${primary.maxTeamSize} members for this event.</div>
    </div>`;

    html += `<div class="field" style="margin-top:18px;"><label>Would you like to participate in one additional event?</label>
      <div style="display:flex; gap:10px;">
        <button type="button" class="btn ${w.wantsSecond===true?'btn-primary':'btn-light'} btn-sm" onclick="App.setWantsSecond(true)">Yes</button>
        <button type="button" class="btn ${w.wantsSecond===false?'btn-primary':'btn-light'} btn-sm" onclick="App.setWantsSecond(false)">No</button>
      </div>
    </div>`;

    if(w.wantsSecond === true){
      html += `<div class="field"><label>Additional event — choose exactly one from the opposite session (${primary.session==='FN'?'AN':'FN'}) *</label>
        <div class="radio-card-group">
          ${oppositeEvents.map(ev=>`
            <label class="radio-card ${w.secondaryEventId===ev.eventId?'selected':''}">
              <input type="radio" name="secondaryEventPicker" value="${ev.eventId}" ${w.secondaryEventId===ev.eventId?'checked':''} onchange="App.setSecondaryEvent('${ev.eventId}')">
              <div class="rc-body"><b>${ev.eventName} ${sessionPill(ev.session)}</b><span>${ev.startTime}–${ev.endTime} · Team ${ev.minTeamSize}-${ev.maxTeamSize} · ${hallName(ev.hallId)}</span></div>
            </label>`).join('')}
        </div>
      </div>`;
      if(w.secondaryEventId){
        const sec = getEvent(w.secondaryEventId);
        html += `<div class="event-subform">
          <label style="display:block; font-size:13px; font-weight:600; margin-bottom:8px;">${sec.eventName} — team members *</label>
          <textarea name="members_${sec.eventId}" required oninput="App.setMembersText('${sec.eventId}', this.value)" placeholder="Member names, comma-separated (min ${sec.minTeamSize}, max ${sec.maxTeamSize}) — can be different people from your primary event team">${escapeHtml(w.membersText[sec.eventId] || '')}</textarea>
          <div class="hint">Between ${sec.minTeamSize} and ${sec.maxTeamSize} members for this event. Does not need to match the primary event's members.</div>
        </div>`;
      }
    }
  }

  return html;
}

/* ============================= DASHBOARD ============================= */
function viewDashboard(){
  const regs = db.registrations.filter(r=>r.status==='REGISTERED');
  const paid = regs.filter(r=>r.paymentStatus==='PAID' && r.paymentAuthorized);
  const pending = regs.filter(r=>!(r.paymentStatus==='PAID' && r.paymentAuthorized));
  const fnOnly = regs.filter(r=> r.selectedEvents.length===1 && r.selectedEvents[0].session==='FN').length;
  const anOnly = regs.filter(r=> r.selectedEvents.length===1 && r.selectedEvents[0].session==='AN').length;
  const both = regs.filter(r=> r.selectedEvents.length===2).length;
  const fnEntries = regs.reduce((s,r)=>s + r.selectedEvents.filter(se=>se.session==='FN' && se.entryStatus==='ENTERED').length,0);
  const anEntries = regs.reduce((s,r)=>s + r.selectedEvents.filter(se=>se.session==='AN' && se.entryStatus==='ENTERED').length,0);
  const totalCash = db.cashTransactions.reduce((s,t)=>s+t.amount,0);
  const totalEntriesCompleted = regs.reduce((s,r)=>s + r.selectedEvents.filter(se=>se.entryStatus==='ENTERED').length,0);
  const activeVolunteers = db.users.filter(u=>u.role==='VOLUNTEER' && u.active).length;
  const pendingSorted = [...pending].sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));

  const eventStats = db.events.map(ev=>{
    const registered = regEventCount(ev.eventId);
    const entered = regs.reduce((s,r)=>s + r.selectedEvents.filter(se=>se.eventId===ev.eventId && se.entryStatus==='ENTERED').length,0);
    const pct = registered ? Math.round(entered/registered*100) : 0;
    return {ev, registered, entered, remaining: ev.capacity-registered, pct};
  });

  const recentRegs = [...regs].sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt)).slice(0,6);
  const recentScans = [...db.scanLogs].sort((a,b)=> new Date(b.timestamp)-new Date(a.timestamp)).slice(0,6);

  return `<div class="wrap">
    <div class="section-head"><div class="eyebrow">Live overview · ${VENUE}</div><h2>Command center</h2></div>
    <div class="grid grid-4">
      <div class="stat accent"><div class="label">Total registrations</div><div class="value">${regs.length}</div><div class="sub">${paid.length} authorized</div></div>
      <div class="stat"><div class="label">Payment pending</div><div class="value">${pending.length}</div><div class="sub">awaiting cash authorization</div></div>
      <div class="stat"><div class="label">Payment authorized</div><div class="value">${paid.length}</div><div class="sub">PAID &amp; VERIFIED</div></div>
      <div class="stat"><div class="label">Total cash collected</div><div class="value">₹${totalCash.toLocaleString()}</div><div class="sub">${db.cashTransactions.length} transactions</div></div>
      <div class="stat"><div class="label">Unauthorized registrations</div><div class="value">${regs.filter(r=>!r.paymentAuthorized).length}</div><div class="sub">not yet payment-verified</div></div>
      <div class="stat"><div class="label">Entries completed</div><div class="value">${totalEntriesCompleted}</div><div class="sub">FN ${fnEntries} · AN ${anEntries}</div></div>
      <div class="stat"><div class="label">FN only / AN only / Both</div><div class="value">${fnOnly} / ${anOnly} / ${both}</div><div class="sub">session split</div></div>
      <div class="stat"><div class="label">Active volunteers</div><div class="value">${activeVolunteers}</div><div class="sub">scanner-only accounts</div></div>
    </div>

    ${pendingSorted.length ? `
    <div class="divider"></div>
    <div class="card" style="border:1.5px solid #f0d9a8; background:#fffaf0;">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <b>PENDING PAYMENT AUTHORIZATIONS</b>
        <span class="badge pending">${pendingSorted.length} waiting</span>
      </div>
      <div class="table-wrap" style="margin-top:14px; border:none;">
        <table><tbody>
        ${pendingSorted.slice(0,8).map(r=>`<tr>
          <td><b>${escapeHtml(r.teamName)}</b><div class="muted small mono">${r.id}</div></td>
          <td class="small">${r.selectedEvents.map(se=>se.eventName).join(' + ')}</td>
          <td class="small">${fmtDateTime(r.createdAt)}</td>
          <td>${paymentBadgeHTML(r)}</td>
          <td style="white-space:nowrap;">
            <button class="btn btn-primary btn-sm" onclick="openAuthorizePaymentModal('${r.id}')">Authorize Payment</button>
            ${App.requireRole(['SUPER_ADMIN']) ? `<button class="icon-btn" onclick="openEditRegModal('${r.id}')">Edit</button>` : ''}
            ${App.requireRole(['SUPER_ADMIN']) ? `<button class="icon-btn" style="color:var(--coral)" onclick="App.deleteRegistration('${r.id}')">Delete</button>` : ''}
          </td>
        </tr>`).join('')}
        </tbody></table>
      </div>
      ${pendingSorted.length>8 ? `<p class="muted small" style="margin-top:10px;">+${pendingSorted.length-8} more — see <a href="#" onclick="App.nav('registrations'); return false;" style="text-decoration:underline;">Registrations</a>.</p>` : ''}
    </div>
    ` : ''}

    <div class="divider"></div>
    <div class="section-head"><h2 style="font-size:20px;">Event-wise capacity &amp; attendance</h2></div>
    <div class="grid grid-2">
      ${eventStats.map(s=>`
        <div class="card">
          <div style="display:flex; justify-content:space-between;"><b>${s.ev.eventName} ${sessionPill(s.ev.session)}</b><span class="mono small muted">${s.pct}% entered</span></div>
          <div class="pbar"><div style="width:${s.pct}%"></div></div>
          <div class="row2 small" style="margin-top:12px;">
            <div><span class="muted">Registered</span><br><b>${s.registered}/${s.ev.capacity}</b></div>
            <div><span class="muted">Entered</span><br><b>${s.entered}</b></div>
            <div><span class="muted">Remaining capacity</span><br><b>${Math.max(s.remaining,0)}</b></div>
          </div>
        </div>`).join('')}
    </div>

    <div class="divider"></div>
    <div class="grid grid-2">
      <div class="card">
        <b>Recent registrations</b>
        <div class="table-wrap" style="margin-top:14px; border:none;">
          <table><tbody>
          ${recentRegs.map(r=>`<tr><td><b>${escapeHtml(r.teamName)}</b><br><span class="muted small">${r.selectedEvents.map(se=>se.eventName).join(' + ')}</span></td><td>${paymentBadgeHTML(r)}</td><td style="white-space:nowrap;">
            <button class="icon-btn" onclick="App.nav('ticket',{regId:'${r.id}'})">View</button>
            ${App.requireRole(['SUPER_ADMIN']) ? `<button class="icon-btn" onclick="openEditRegModal('${r.id}')">Edit</button>` : ''}
            ${App.requireRole(['SUPER_ADMIN']) ? `<button class="icon-btn" style="color:var(--coral)" onclick="App.deleteRegistration('${r.id}')">Delete</button>` : ''}
          </td></tr>`).join('') || '<tr><td class="muted small">No registrations yet</td></tr>'}
          </tbody></table>
        </div>
      </div>
      <div class="card">
        <b>Recent scan activity</b>
        <div class="table-wrap" style="margin-top:14px; border:none;">
          <table><tbody>
          ${recentScans.length ? recentScans.map(l=>`<tr><td><b>${l.teamName||l.regId||'—'}</b><br><span class="muted small">${l.eventName||''} · ${hallName(l.hallId)} · ${fmtDateTime(l.timestamp)}</span></td><td>${l.result==='APPROVED'||l.result==='OVERRIDE_APPROVED'?'<span class="badge paid">APPROVED</span>':`<span class="badge cancelled">${l.reason}</span>`}</td></tr>`).join('') : '<tr><td class="muted small">No scans yet</td></tr>'}
          </tbody></table>
        </div>
      </div>
    </div>

    <div class="divider"></div>
    <div class="card">
      <b>Hall-wise live status</b>
      <div class="grid grid-3" style="margin-top:14px;">
        ${db.halls.map(h=>{
          const hallEvents = db.events.filter(e=>e.hallId===h.id);
          const vols = db.users.filter(u=>u.role==='VOLUNTEER' && u.hallId===h.id && u.active);
          const hallRegs = regs.filter(r=>r.selectedEvents.some(se=>se.hallId===h.id)).length;
          const hallEntries = regs.reduce((s,r)=>s + r.selectedEvents.filter(se=>se.hallId===h.id && se.entryStatus==='ENTERED').length,0);
          return `<div class="card" style="background:var(--violet-soft); border:none;">
            <b>${h.name}</b>
            <p class="small muted" style="margin-top:6px;">Events: ${hallEvents.map(e=>e.eventName).join(', ')||'—'}</p>
            <p class="small muted" style="margin-top:4px;">Volunteers: ${vols.map(v=>v.name).join(', ')||'—'}</p>
            <div class="row2 small" style="margin-top:10px;">
              <div><span class="muted">Registrations</span><br><b>${hallRegs}</b></div>
              <div><span class="muted">Entries</span><br><b>${hallEntries}</b></div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>${footer()}`;
}

      r.teamName.toLowerCase().includes(q) || r.id.toLowerCase().includes(q) ||

      <div style="display:flex; gap:10px;">
        <button class="btn btn-light btn-sm" onclick="App.exportCSV()">Export CSV</button>

    </div>

      <input name="q" placeholder="Search by team, registration ID, phone, event or college" value="${App.params.q||''}" style="flex:1; padding:11px 13px; border:1.5px solid var(--line); border-radius:10px;">
      <button class="btn btn-primary btn-sm" type="submit">Search</button>
    </form>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Reg ID</th><th>Team</th><th>Event(s)</th><th>College</th><th>Members</th>
          <th>Reg. status</th><th>Payment</th><th>Authorization</th><th>Refreshment</th><th>Amount due</th>
          <th>Registered</th><th>Authorized by</th><th>Authorized at</th><th></th>
